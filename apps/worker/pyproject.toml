[project]
name = "clipmax-worker"
version = "0.1.0"
description = "ClipMax video processing worker — transcription, highlight detection, and 9:16 rendering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.36,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
  "yt-dlp>=2024.12",
]

[project.optional-dependencies]
local-whisper = [
  "faster-whisper>=1.1,<2.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.15.1",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipmax_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["clipmax_worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["clipmax_worker"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
