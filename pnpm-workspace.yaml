packages:
  - "apps/web"
  - "apps/site"
  - "packages/*"

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.10"
  - "@turbo/darwin-arm64@2.11.10"
  - "@turbo/linux-64@2.11.10"
  - "@turbo/linux-arm64@2.11.10"
  - "@turbo/windows-64@2.11.10"
  - "@turbo/windows-arm64@2.11.10"
  - lucide-react@1.60.0
  - turbo@2.11.10

# pnpm 11 build-script policy. `unrs-resolver` ships prebuilt platform binaries;
# its postinstall is only a fallback, but approving it keeps installs deterministic.
allowBuilds:
  sharp: true
  unrs-resolver: true
